<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Workout — Hero with Settings (Prototype)</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;600;800&family=Oswald:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#070606;
      --card-bg: rgba(255,255,255,0.03);
      --muted: rgba(255,255,255,0.64);
      --accent: #FFD166;
      --glass: rgba(255,255,255,0.06);
      --radius: 22px;
      --focus: 3px solid rgba(255,209,102,0.18);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: Montserrat, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background: linear-gradient(180deg,#050505 0%, #0b0b0b 100%);
      color: #fff;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      padding:18px;
    }

    /* Header */
    .header{
      display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;
    }
    .greeting{font-weight:800;font-size:20px;letter-spacing:-0.02em}
    .header-actions{display:flex;gap:12px;align-items:center}
    .icon-btn{background:var(--glass);border:0;padding:10px;border-radius:12px;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px}
    .icon-btn:focus{outline:var(--focus)}

    /* Hero card */
    .hero{position:relative;border-radius:var(--radius);overflow:hidden;background:var(--card-bg);max-width:420px;margin:0 auto 22px;box-shadow:0 12px 30px rgba(0,0,0,0.6);}
    .hero__media{display:block;width:100%;height:220px;object-fit:cover;transform:scale(1.03);transition:transform .8s ease}
    .hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0.28) 10%, rgba(0,0,0,0.62) 70%);pointer-events:none}
    .hero__content{position:absolute;left:18px;right:18px;bottom:16px;z-index:3;display:flex;flex-direction:column;gap:12px}
    .badge{display:inline-flex;align-items:center;gap:8px;background:rgba(0,0,0,0.36);padding:6px 10px;border-radius:999px;font-size:12px;color:var(--muted);width:max-content}

    .headline{font-family: Oswald, "Segoe UI", Arial, sans-serif;font-weight:700;font-size:20px;line-height:1.02;color:#fff;text-transform:none;letter-spacing:-0.02em;text-shadow:0 8px 22px rgba(0,0,0,0.6)}
    .subline{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:0.18em}

    .cta{
      display:inline-flex;align-items:center;gap:12px;background:#fff;color:#000;padding:12px 18px;border-radius:999px;border:0;font-weight:600;min-height:48px;min-width:48px;box-shadow:0 10px 26px rgba(0,0,0,0.5);cursor:pointer}
    .cta:active{transform:translateY(1px)}
    .cta:focus{outline:var(--focus)}

    .meta{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px}

    /* bottom nav */
    .bottom-nav{position:fixed;left:18px;right:18px;bottom:18px;display:flex;gap:14px;justify-content:space-between;align-items:center;max-width:600px;margin:0 auto}
    .nav-btn{background:rgba(255,255,255,0.03);padding:12px;border-radius:14px;min-width:64px;display:flex;align-items:center;gap:10px;justify-content:center;color:var(--muted);border:0}
    .nav-btn:focus{outline:var(--focus)}

    /* Settings modal */
    .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:none;align-items:center;justify-content:center}
    .modal{background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));border-radius:14px;padding:18px;max-width:420px;color:#fff}
    .modal h3{margin:0 0 8px;font-size:18px}
    .row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.03)}

    .switch{width:46px;height:26px;border-radius:999px;background:rgba(255,255,255,0.12);position:relative;padding:3px;cursor:pointer}
    .switch__knob{width:18px;height:18px;border-radius:50%;background:#fff;position:absolute;left:4px;top:3px;transition:left .18s ease}
    .switch[data-on="true"]{background:linear-gradient(90deg,var(--accent),#ffae3d)}
    .switch[data-on="true"] .switch__knob{left:24px}

    /* utilities */
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

    @media (prefers-reduced-motion:reduce){
      *{transition:none}
    }
  </style>
</head>
<body>
  <header class="header" role="banner">
    <div>
      <div style="font-size:12px;color:var(--muted)">Wednesday, March 4</div>
      <div class="greeting">Hi, Bandan!</div>
    </div>
    <div class="header-actions">
      <button type="button" class="icon-btn" id="settingsBtn" aria-haspopup="dialog" aria-controls="settingsModal" aria-expanded="false" title="Open settings">
        ⚙️
      </button>
      <button type="button" class="icon-btn" aria-label="Notifications" title="Notifications">
        🔔
      </button>
    </div>
  </header>

  <main>
    <section aria-label="Today's Plan">
      <div style="font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:0.16em;margin-bottom:8px">Today's plan</div>

      <article class="hero" aria-labelledby="hero-title">
        <img src="https://images.unsplash.com/photo-1534367611325-1f30c90b6a8b?q=80&w=1200&auto=format&fit=crop" alt="Boxing gloves resting on a gym mat" class="hero__media">
        <div class="hero__content">
          <div class="badge">Trainer suggestion</div>
          <h2 id="hero-title" class="headline">20 minutes, practicing punches as fast as the wind</h2>
          <div style="display:flex;align-items:center;justify-content:space-between;gap:12px">
            <button type="button" class="cta" id="engageBtn" aria-label="Start 20 minute session">▶️ Engage</button>
            <div class="meta"><span style="font-weight:700">20 min</span><span style="color:var(--muted)">time</span></div>
          </div>
        </div>
      </article>
    </section>
  </main>

    <nav class="bottom-nav" role="navigation" aria-label="Primary">
    <button type="button" class="nav-btn" aria-label="Home">🏠 <span class="sr-only">Home</span></button>
    <button type="button" class="nav-btn" aria-label="Workouts">💪</button>
    <button type="button" class="nav-btn" aria-label="Nutrition">🍽️</button>
    <button type="button" class="nav-btn" aria-label="Profile">👤</button>
  </nav>

  <!-- Settings modal -->
  <div class="modal-backdrop" id="settingsModal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal" role="document">
      <h3>Settings</h3>
      <div class="row">
        <div>
          <div style="font-size:13px">Dark Mode</div>
          <div style="font-size:12px;color:var(--muted)">Keep the app in a dark theme</div>
        </div>
        <div>
          <button type="button" class="switch" id="darkSwitch" data-on="true" aria-pressed="true" aria-label="Toggle dark mode">
            <span class="switch__knob"></span>
          </button>
        </div>
      </div>
      <div class="row">
        <div>
          <div style="font-size:13px">Show Trainer Tips</div>
          <div style="font-size:12px;color:var(--muted)">Personalized guidance for your workouts</div>
        </div>
        <div>
          <button type="button" class="switch" id="tipsSwitch" data-on="true" aria-pressed="true" aria-label="Toggle trainer tips">
            <span class="switch__knob"></span>
          </button>
        </div>
      </div>
      <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:12px">
        <button type="button" class="nav-btn" id="closeSettings">Close</button>
      </div>
    </div>
  </div>

  <script>
    // Settings modal logic
    const settingsBtn = document.getElementById('settingsBtn');
    const settingsModal = document.getElementById('settingsModal');
    const closeSettings = document.getElementById('closeSettings');
    settingsBtn.addEventListener('click', ()=>{
      const expanded = settingsBtn.getAttribute('aria-expanded') === 'true';
      settingsBtn.setAttribute('aria-expanded', String(!expanded));
      settingsModal.style.display = 'flex';
      settingsModal.setAttribute('aria-hidden', 'false');
      // focus first focusable
      closeSettings.focus();
    });
    closeSettings.addEventListener('click', ()=>{
      settingsModal.style.display = 'none';
      settingsModal.setAttribute('aria-hidden', 'true');
      settingsBtn.setAttribute('aria-expanded','false');
      settingsBtn.focus();
    });
    settingsModal.addEventListener('click', (e)=>{
      if(e.target === settingsModal) { closeSettings.click(); }
    });

    // Switch toggles
    function toggleSwitch(btn){
      const on = btn.getAttribute('data-on') === 'true';
      btn.setAttribute('data-on', String(!on));
      btn.setAttribute('aria-pressed', String(!on));
    }
    document.getElementById('darkSwitch').addEventListener('click', (e)=>toggleSwitch(e.currentTarget));
    document.getElementById('tipsSwitch').addEventListener('click', (e)=>toggleSwitch(e.currentTarget));

    // Engage button demo
    document.getElementById('engageBtn').addEventListener('click', ()=>{
      alert('Starting 20 minute session — prototype');
    });
  </script>
</body>
</html>
