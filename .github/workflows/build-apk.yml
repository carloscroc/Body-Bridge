name: Build & Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag / version, e.g. v1.0.0'
        required: true
        type: string

permissions:
  contents: write

# ---------------------------------------------------------------------------
# Secrets strategy (no-secret builds are first-class):
#  * With NO Firebase/Convex secrets configured, this workflow stays green:
#    a placeholder lib/firebase_options.dart is generated when the repo
#    depends on firebase_core, and a placeholder
#    android/app/google-services.json when the google-services Gradle plugin
#    is applied. The app boots in guest mode when Firebase config is invalid
#    (failure-tolerant init), so placeholders are safe for CI.
#  * Real config is used ONLY when these repo secrets exist:
#      FIREBASE_CONFIG_B64      - base64 of the Firebase app config JSON
#      GOOGLE_SERVICES_JSON_B64 - base64 of a google-services.json
#      CONVEX_URL               - Convex deployment URL
#  * Injection only happens when the matching dependency/plugin is present
#    in the repo, so the workflow is correct before AND after the auth
#    feature lands. Config files already committed are never overwritten.
#  * CONVEX_URL is passed as --dart-define=CONVEX_URL=... ONLY when the
#    secret is non-empty; the flag is omitted otherwise. NOTE: when
#    injected, release-job APKs may diverge byte-wise from F-Droid
#    reproducible builds (which build without secrets) - flagged for
#    product decision.
#  * Secret VALUES never appear in this file - secret names only.
# ---------------------------------------------------------------------------

# Pinned Flutter version. F-Droid extracts this exact value from the recipe so
# its build matches upstream. Defined once here and reused by both jobs.
env:
  FLUTTER_VERSION: '3.41.9'

jobs:
  build:
    name: Build split APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Show versions
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      # See the 'Secrets strategy' block at the top of this file.
      # Generates placeholder or secret-backed Firebase config so the build
      # stays green with or without credentials; committed files are kept.
      - name: Prepare Firebase config (optional)
        env:
          FIREBASE_CONFIG_B64: ${{ secrets.FIREBASE_CONFIG_B64 }}
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          set -euo pipefail
          if ! grep -q 'firebase_core:' pubspec.yaml; then
            echo 'no firebase_core dependency; skipping Firebase config generation'
            exit 0
          fi
          if [ -f lib/firebase_options.dart ]; then
            echo 'lib/firebase_options.dart already committed; leaving untouched'
          else
            if [ -n "${FIREBASE_CONFIG_B64:-}" ]; then
              CONFIG_JSON="$(printf '%s' "$FIREBASE_CONFIG_B64" | base64 -d)"
              echo 'lib/firebase_options.dart generated from FIREBASE_CONFIG_B64'
            else
              CONFIG_JSON='{"apiKey":"placeholder","appId":"placeholder","projectId":"placeholder","messagingSenderId":"placeholder","storageBucket":"placeholder","authDomain":"placeholder"}'
              echo 'lib/firebase_options.dart generated with placeholder values (guest-mode fallback)'
            fi
            python3 - "$CONFIG_JSON" <<'PYEOF'
          import json, sys
          
          c = json.loads(sys.argv[1])
          for key in ('apiKey', 'appId', 'projectId', 'messagingSenderId', 'storageBucket', 'authDomain'):
              c.setdefault(key, 'placeholder')
          tpl = r'''// GENERATED BY CI (.github/workflows/build-apk.yml). Do not edit.
          // Placeholder values keep `flutter build apk` green on runners without
          // Firebase secrets; the app boots in guest mode when config is invalid.
          import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;
          import 'package:flutter/foundation.dart'
              show TargetPlatform, defaultTargetPlatform;
          
          class DefaultFirebaseOptions {
            static FirebaseOptions get currentPlatform {
              switch (defaultTargetPlatform) {
                case TargetPlatform.android:
                  return android;
                case TargetPlatform.iOS:
                  return ios;
                default:
                  return web;
              }
            }
          
            static const FirebaseOptions android = FirebaseOptions(
              apiKey: '__FBCFG1__',
              appId: '__APPID__',
              messagingSenderId: '__MESSAGINGSENDERID__',
              projectId: '__PROJECTID__',
              storageBucket: '__STORAGEBUCKET__',
            );
          
            static const FirebaseOptions ios = FirebaseOptions(
              apiKey: '__FBCFG1__',
              appId: '__APPID__',
              messagingSenderId: '__MESSAGINGSENDERID__',
              projectId: '__PROJECTID__',
              storageBucket: '__STORAGEBUCKET__',
              iosBundleId: 'com.gymmane.app',
            );
          
            static const FirebaseOptions web = FirebaseOptions(
              apiKey: '__FBCFG1__',
              appId: '__APPID__',
              messagingSenderId: '__MESSAGINGSENDERID__',
              projectId: '__PROJECTID__',
              storageBucket: '__STORAGEBUCKET__',
              authDomain: '__AUTHDOMAIN__',
            );
          }
          '''
          for key, val in c.items():
              tpl = tpl.replace('__' + key.upper() + '__', str(val))
          tpl = tpl.replace('__FBCFG1__', str(c.get('apiKey', 'placeholder')))
          with open('lib/firebase_options.dart', 'w', encoding='utf-8') as fh:
              fh.write(tpl)
          PYEOF
          fi
          if ! grep -q 'com.google.gms.google-services' android/app/build.gradle.kts android/build.gradle.kts 2>/dev/null; then
            echo 'no google-services Gradle plugin; skipping google-services.json'
            exit 0
          fi
          if [ -f android/app/google-services.json ]; then
            echo 'android/app/google-services.json already committed; leaving untouched'
            exit 0
          fi
          if [ -n "${GOOGLE_SERVICES_JSON_B64:-}" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_B64" | base64 -d > android/app/google-services.json
            echo 'android/app/google-services.json decoded from GOOGLE_SERVICES_JSON_B64'
          else
            cat > android/app/google-services.json <<'GSEOF'
          {"project_info":{"project_number":"000000000000","project_id":"gymmane-placeholder","storage_bucket":"gymmane-placeholder.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:placeholder000000","android_client_info":{"package_name":"com.gymmane.app"}},"oauth_client":[],"api_key":[{"current_key":"placeholder"}],"services":{"analytics_service":{"status":1}}}],"configuration_version":"1"}
          GSEOF
            echo 'android/app/google-services.json written with placeholder values (guest-mode fallback)'
          fi

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      # Firebase auth config is passed as --dart-define=FB_* flags ONLY when the
      # FIREBASE_CONFIG_B64 repo secret exists; omitted otherwise (the app
      # degrades gracefully to guest mode).
      - name: Resolve Firebase dart-defines
        id: fb
        env:
          FIREBASE_CONFIG_B64: ${{ secrets.FIREBASE_CONFIG_B64 }}
        run: |
          set -euo pipefail
          if [ -n "${FIREBASE_CONFIG_B64:-}" ]; then
            CONFIG_JSON="$(printf '%s' "$FIREBASE_CONFIG_B64" | base64 -d)"
            ARGS="$(python3 - "$CONFIG_JSON" <<'PYEOF'
          import json, sys

          c = json.loads(sys.argv[1])
          pairs = (
              ('FB_API_KEY', 'apiKey'),
              ('FB_APP_ID', 'appId'),
              ('FB_SENDER_ID', 'messagingSenderId'),
              ('FB_PROJECT_ID', 'projectId'),
              ('FB_AUTH_DOMAIN', 'authDomain'),
              ('FB_STORAGE_BUCKET', 'storageBucket'),
          )
          parts = []
          for flag, key in pairs:
              val = c.get(key)
              if val:
                  parts.append('--dart-define=' + flag + '=' + str(val))
          print(' '.join(parts))
          PYEOF
          )"
            echo 'Firebase FB_* dart-defines injected via --dart-define'
            echo "args=$ARGS" >> "$GITHUB_OUTPUT"
          else
            echo 'building without Firebase dart-defines (guest-mode fallback)'
            echo "args=" >> "$GITHUB_OUTPUT"
          fi

      # ABI splits keep each APK small instead of one fat APK.
      # --dart-define=CONVEX_URL is injected ONLY when the CONVEX_URL repo
      # secret exists; omitted otherwise (the app degrades gracefully).
      # NOTE: when injected, release-job APKs may diverge byte-wise from
      # F-Droid reproducible builds (which build without secrets) - flagged
      # for product decision.
      - name: Build split APKs
        env:
          CONVEX_URL: ${{ secrets.CONVEX_URL }}
        run: |
          set -euo pipefail
          ARGS=(flutter build apk --release --split-per-abi ${{ steps.fb.outputs.args }})
          if [ -n "${CONVEX_URL:-}" ]; then
            ARGS+=(--dart-define=CONVEX_URL="$CONVEX_URL")
            echo 'CONVEX_URL injected via --dart-define'
          else
            echo 'CONVEX_URL secret not set; building without the Convex dart-define'
          fi
          "${ARGS[@]}"

      - name: Rename APKs
        run: |
          cd build/app/outputs/flutter-apk
          mv app-arm64-v8a-release.apk     body-bridge-arm64-v8a.apk
          mv app-armeabi-v7a-release.apk   body-bridge-armeabi-v7a.apk
          mv app-x86_64-release.apk        body-bridge-x86_64.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: body-bridge-apks
          path: build/app/outputs/flutter-apk/body-bridge-*.apk
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    # Only when manually dispatched with a tag. The release body is left empty
    # on purpose so it can be filled in by hand after publishing.
    if: github.event_name == 'workflow_dispatch'

    # Reproducible build: keep the pub cache at a fixed path inside the workspace
    # (/home/runner/work/GymMane/GymMane/.pub-cache). F-Droid relocates its build
    # to this exact same path and uses the same PUB_CACHE, so the embedded paths
    # match.
    env:
      PUB_CACHE: ${{ github.workspace }}/.pub-cache

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      # See the 'Secrets strategy' block at the top of this file.
      # Generates placeholder or secret-backed Firebase config so the build
      # stays green with or without credentials; committed files are kept.
      - name: Prepare Firebase config (optional)
        env:
          FIREBASE_CONFIG_B64: ${{ secrets.FIREBASE_CONFIG_B64 }}
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          set -euo pipefail
          if ! grep -q 'firebase_core:' pubspec.yaml; then
            echo 'no firebase_core dependency; skipping Firebase config generation'
            exit 0
          fi
          if [ -f lib/firebase_options.dart ]; then
            echo 'lib/firebase_options.dart already committed; leaving untouched'
          else
            if [ -n "${FIREBASE_CONFIG_B64:-}" ]; then
              CONFIG_JSON="$(printf '%s' "$FIREBASE_CONFIG_B64" | base64 -d)"
              echo 'lib/firebase_options.dart generated from FIREBASE_CONFIG_B64'
            else
              CONFIG_JSON='{"apiKey":"placeholder","appId":"placeholder","projectId":"placeholder","messagingSenderId":"placeholder","storageBucket":"placeholder","authDomain":"placeholder"}'
              echo 'lib/firebase_options.dart generated with placeholder values (guest-mode fallback)'
            fi
            python3 - "$CONFIG_JSON" <<'PYEOF'
          import json, sys
          
          c = json.loads(sys.argv[1])
          for key in ('apiKey', 'appId', 'projectId', 'messagingSenderId', 'storageBucket', 'authDomain'):
              c.setdefault(key, 'placeholder')
          tpl = r'''// GENERATED BY CI (.github/workflows/build-apk.yml). Do not edit.
          // Placeholder values keep `flutter build apk` green on runners without
          // Firebase secrets; the app boots in guest mode when config is invalid.
          import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;
          import 'package:flutter/foundation.dart'
              show TargetPlatform, defaultTargetPlatform;
          
          class DefaultFirebaseOptions {
            static FirebaseOptions get currentPlatform {
              switch (defaultTargetPlatform) {
                case TargetPlatform.android:
                  return android;
                case TargetPlatform.iOS:
                  return ios;
                default:
                  return web;
              }
            }
          
            static const FirebaseOptions android = FirebaseOptions(
              apiKey: '__FBCFG1__',
              appId: '__APPID__',
              messagingSenderId: '__MESSAGINGSENDERID__',
              projectId: '__PROJECTID__',
              storageBucket: '__STORAGEBUCKET__',
            );
          
            static const FirebaseOptions ios = FirebaseOptions(
              apiKey: '__FBCFG1__',
              appId: '__APPID__',
              messagingSenderId: '__MESSAGINGSENDERID__',
              projectId: '__PROJECTID__',
              storageBucket: '__STORAGEBUCKET__',
              iosBundleId: 'com.gymmane.app',
            );
          
            static const FirebaseOptions web = FirebaseOptions(
              apiKey: '__FBCFG1__',
              appId: '__APPID__',
              messagingSenderId: '__MESSAGINGSENDERID__',
              projectId: '__PROJECTID__',
              storageBucket: '__STORAGEBUCKET__',
              authDomain: '__AUTHDOMAIN__',
            );
          }
          '''
          for key, val in c.items():
              tpl = tpl.replace('__' + key.upper() + '__', str(val))
          tpl = tpl.replace('__FBCFG1__', str(c.get('apiKey', 'placeholder')))
          with open('lib/firebase_options.dart', 'w', encoding='utf-8') as fh:
              fh.write(tpl)
          PYEOF
          fi
          if ! grep -q 'com.google.gms.google-services' android/app/build.gradle.kts android/build.gradle.kts 2>/dev/null; then
            echo 'no google-services Gradle plugin; skipping google-services.json'
            exit 0
          fi
          if [ -f android/app/google-services.json ]; then
            echo 'android/app/google-services.json already committed; leaving untouched'
            exit 0
          fi
          if [ -n "${GOOGLE_SERVICES_JSON_B64:-}" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_B64" | base64 -d > android/app/google-services.json
            echo 'android/app/google-services.json decoded from GOOGLE_SERVICES_JSON_B64'
          else
            cat > android/app/google-services.json <<'GSEOF'
          {"project_info":{"project_number":"000000000000","project_id":"gymmane-placeholder","storage_bucket":"gymmane-placeholder.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:placeholder000000","android_client_info":{"package_name":"com.gymmane.app"}},"oauth_client":[],"api_key":[{"current_key":"placeholder"}],"services":{"analytics_service":{"status":1}}}],"configuration_version":"1"}
          GSEOF
            echo 'android/app/google-services.json written with placeholder values (guest-mode fallback)'
          fi

      # Reproducibility: the jni package bakes a unique build-id into libdartjni.so.
      # Force --build-id=none so the native lib is deterministic. F-Droid applies
      # this exact same patch in its recipe.
      - name: Patch jni build-id
        run: sed -i -e 's/-Wl,/-Wl,--build-id=none,/' "$PUB_CACHE"/hosted/pub.dev/jni-*/src/CMakeLists.txt

      # Sign the release APKs with the release keystore (kept in GitHub Secrets)
      # so the published binaries match F-Droid's reproducible build.
      - name: Set up signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/bodybridge-release.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=bodybridge-release.jks
          EOF

      # Firebase auth config is passed as --dart-define=FB_* flags ONLY when the
      # FIREBASE_CONFIG_B64 repo secret exists; omitted otherwise (the app
      # degrades gracefully to guest mode).
      - name: Resolve Firebase dart-defines
        id: fb
        env:
          FIREBASE_CONFIG_B64: ${{ secrets.FIREBASE_CONFIG_B64 }}
        run: |
          set -euo pipefail
          if [ -n "${FIREBASE_CONFIG_B64:-}" ]; then
            CONFIG_JSON="$(printf '%s' "$FIREBASE_CONFIG_B64" | base64 -d)"
            ARGS="$(python3 - "$CONFIG_JSON" <<'PYEOF'
          import json, sys

          c = json.loads(sys.argv[1])
          pairs = (
              ('FB_API_KEY', 'apiKey'),
              ('FB_APP_ID', 'appId'),
              ('FB_SENDER_ID', 'messagingSenderId'),
              ('FB_PROJECT_ID', 'projectId'),
              ('FB_AUTH_DOMAIN', 'authDomain'),
              ('FB_STORAGE_BUCKET', 'storageBucket'),
          )
          parts = []
          for flag, key in pairs:
              val = c.get(key)
              if val:
                  parts.append('--dart-define=' + flag + '=' + str(val))
          print(' '.join(parts))
          PYEOF
          )"
            echo 'Firebase FB_* dart-defines injected via --dart-define'
            echo "args=$ARGS" >> "$GITHUB_OUTPUT"
          else
            echo 'building without Firebase dart-defines (guest-mode fallback)'
            echo "args=" >> "$GITHUB_OUTPUT"
          fi

      # Reproducible build: version name AND code come entirely from pubspec.yaml
      # (1.0.0+1), exactly like F-Droid builds it. Do NOT pass --build-name or
      # --build-number here, or the APK won't match F-Droid's.
      # --split-debug-info moves the path-laden debug symbols out of libapp.so so
      # it builds deterministically. F-Droid uses the same flag.
      # --dart-define=CONVEX_URL is injected ONLY when the CONVEX_URL repo
      # secret exists; omitted otherwise (the app degrades gracefully).
      # NOTE: when injected, release-job APKs may diverge byte-wise from
      # F-Droid reproducible builds (which build without secrets) - flagged
      # for product decision.
      - name: Build split APKs
        env:
          CONVEX_URL: ${{ secrets.CONVEX_URL }}
        run: |
          set -euo pipefail
          ARGS=(flutter build apk --release --split-per-abi --split-debug-info=build/symbols ${{ steps.fb.outputs.args }})
          if [ -n "${CONVEX_URL:-}" ]; then
            ARGS+=(--dart-define=CONVEX_URL="$CONVEX_URL")
            echo 'CONVEX_URL injected via --dart-define'
          else
            echo 'CONVEX_URL secret not set; building without the Convex dart-define'
          fi
          "${ARGS[@]}"

      - name: Rename APKs
        run: |
          cd build/app/outputs/flutter-apk
          mv app-arm64-v8a-release.apk     body-bridge-arm64-v8a.apk
          mv app-armeabi-v7a-release.apk   body-bridge-armeabi-v7a.apk
          mv app-x86_64-release.apk        body-bridge-x86_64.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: Body Bridge ${{ inputs.tag }}
          files: |
            build/app/outputs/flutter-apk/body-bridge-arm64-v8a.apk
            build/app/outputs/flutter-apk/body-bridge-armeabi-v7a.apk
            build/app/outputs/flutter-apk/body-bridge-x86_64.apk
